<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F4D"/>
      <stop offset="1" stop-color="#071633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#7DB8FF"/>
    </linearGradient>
    <linearGradient id="logo-g" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#0B1F4D"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="280" fill="#1E5EFF" opacity="0.12"/>
  <ellipse cx="1050" cy="450" rx="260" ry="240" fill="#2F80ED" opacity="0.1"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="76" height="76" rx="20" fill="url(#logo-g)"/>
  <text x="118" y="128" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#2F80ED" letter-spacing="1">ATS</text>
  <!-- Company name -->
  <text x="174" y="116" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="white" letter-spacing="2">ATS GROUP</text>
  <text x="174" y="140" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#7DB8FF" letter-spacing="4">OF COMPANIES</text>
  <!-- Main headline -->
  <text x="80" y="295" font-family="'Arial Black', sans-serif" font-size="64" font-weight="900" fill="white">Engineered for Scale.</text>
  <text x="80" y="375" font-family="'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#accent)">Built for Growth.</text>
  <!-- Subtext -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.75)">Web Architecture · Digital Marketing &amp; SEO · Teknon IT Education</text>
  <!-- Capabilities row -->
  <rect x="80" y="495" width="260" height="70" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
  <text x="105" y="525" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#7DB8FF">ATS DIGITAL</text>
  <text x="105" y="548" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">Websites, SEO &amp; Growth</text>
  <rect x="360" y="495" width="260" height="70" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
  <text x="385" y="525" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#7DB8FF">TEKNON SOLUTIONS</text>
  <text x="385" y="548" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">IT Internships &amp; Training</text>
  <rect x="640" y="495" width="240" height="70" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
  <text x="665" y="525" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#E5B94E">RAJAHMUNDRY</text>
  <text x="665" y="548" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">Campus &amp; Online Programs</text>
  <!-- Right accent bar -->
  <rect x="1100" y="0" width="6" height="630" rx="3" fill="url(#accent)" opacity="0.6"/>
  <!-- Domain -->
  <text x="1120" y="620" text-anchor="end" font-family="'Courier New', monospace" font-size="18" fill="rgba(255,255,255,0.35)" letter-spacing="1">ateknonsolutions.com</text>
</svg>
