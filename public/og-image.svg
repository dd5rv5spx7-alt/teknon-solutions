<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F4D"/>
      <stop offset="1" stop-color="#071633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#7DB8FF"/>
    </linearGradient>
    <linearGradient id="logo-g" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F80ED"/>
      <stop offset="1" stop-color="#0B1F4D"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.1)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="280" fill="#1E5EFF" opacity="0.12"/>
  <ellipse cx="1050" cy="450" rx="260" ry="240" fill="#2F80ED" opacity="0.1"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="76" height="76" rx="20" fill="url(#logo-g)"/>
  <rect x="97" y="100" width="42" height="10" rx="5" fill="white"/>
  <rect x="111" y="100" width="10" height="40" rx="5" fill="white"/>
  <!-- Company name -->
  <text x="174" y="120" font-family="'Arial Black', sans-serif" font-size="27" font-weight="900" fill="white" letter-spacing="2">A TEKNON</text>
  <text x="174" y="144" font-family="'Courier New', monospace" font-size="13" fill="rgba(255,255,255,0.5)" letter-spacing="5">SOLUTIONS</text>
  <!-- Main headline -->
  <text x="80" y="310" font-family="'Arial Black', sans-serif" font-size="72" font-weight="900" fill="white">Learn. Build.</text>
  <text x="80" y="400" font-family="'Arial Black', sans-serif" font-size="72" font-weight="900" fill="url(#accent)">Grow.</text>
  <!-- Subtext -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">IT Internships &amp; Training · Rajahmundry · Online &amp; Offline</text>
  <!-- Stats row -->
  <rect x="80" y="510" width="200" height="60" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="100" y="535" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="white">500+</text>
  <text x="100" y="556" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Students Trained</text>
  <rect x="300" y="510" width="200" height="60" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="320" y="535" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="white">50+</text>
  <text x="320" y="556" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Live Projects</text>
  <rect x="520" y="510" width="200" height="60" rx="12" fill="rgba(255,255,255,0.07)"/>
  <text x="540" y="535" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="white">20+</text>
  <text x="540" y="556" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Technologies</text>
  <!-- Right accent bar -->
  <rect x="1100" y="0" width="6" height="630" rx="3" fill="url(#accent)" opacity="0.6"/>
  <!-- Domain -->
  <text x="1120" y="620" text-anchor="end" font-family="'Courier New', monospace" font-size="18" fill="rgba(255,255,255,0.35)" letter-spacing="1">ateknonsolutions.com</text>
</svg>
