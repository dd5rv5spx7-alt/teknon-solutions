    <!-- Fallback title only: description/robots/canonical/OG/Twitter are
         owned by <Seo> (src/components/Seo.jsx, via react-helmet-async) so
         every route gets correct values. Title is safe to duplicate here —
         Helmet overwrites document.title directly rather than inserting a
         second node — but meta/link tags aren't: keeping both copies of
         those produces two conflicting canonical/og tags per page, which
         search engines resolve by discarding both rather than picking one.
         Non-JS bots (Facebook/WhatsApp/LinkedIn/Slack/X preview crawlers)
         never run Helmet, so a shared blog-post link still shows this
         fallback rather than the post's own card — fixing that needs
         server-side tag injection or prerendering, out of scope here. -->
    <title>A Teknon Solutions | IT Internship &amp; Training Institute, Rajahmundry</title>
    <meta name="keywords" content="IT Training Institute, Internship Programs, Software Training, Python Training, Java Training, React Training, Full Stack Course, Cybersecurity Training, AI Training, Online Internship, Offline Internship, Rajahmundry Training Institute, Best Internship Institute, Coding Institute, Tech Training" />
    <meta name="author" content="A Teknon Solutions" />
